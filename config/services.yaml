# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    env(MONGODB_URL): ''
    env(MONGODB_DB): ''

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    App\ClientManagement\Domain\Service\ClientSubscriber:
        tags:
            - { name: 'kernel.event_subscriber' }

    App\ClientManagement\Infrastructure\Controller\:
        resource: '../src/ClientManagement/Infrastructure/Controller'
        tags: [ 'controller.service_arguments' ]

    App\Common\Infrastructure\Web\Controller\:
        resource: '../src/Common/Infrastructure/Web/Controller'
        tags: [ 'controller.service_arguments' ]

    App\Common\Infrastructure\Commands\SecretRegenerateAppSecretCommand:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\ClientManagement\Application\Service\ClientRegistrationService:
        arguments:
            $clientRepository: '@App\ClientManagement\Infrastructure\Repository\ClientRepository'
            $eventDispatcher: '@event_dispatcher'

    Doctrine\Persistence\ManagerRegistry:
        alias: doctrine_mongodb.odm.manager_registry

    App\ClientManagement\Infrastructure\Repository\ClientRepository:
        class: App\ClientManagement\Infrastructure\Repository\ClientRepository
        arguments:
            - '@doctrine_mongodb'

    Doctrine\ODM\MongoDB\ManagerRegistry:
        alias: 'doctrine_mongodb'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
