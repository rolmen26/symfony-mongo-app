# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    env(MONGODB_URL): ''
    env(MONGODB_DB): ''

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    App\ClientManagement\Infrastructure\Controller\:
        resource: '../src/ClientManagement/Infrastructure/Controller'
        tags: [ 'controller.service_arguments' ]

    App\Common\Infrastructure\Web\Controller\:
        resource: '../src/Common/Infrastructure/Web/Controller'
        tags: [ 'controller.service_arguments' ]

    App\Common\Infrastructure\Commands\SecretRegenerateAppSecretCommand:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\ClientManagement\Application\Handler\RegisterClientCommandHandler:
        tags: ['messenger.message_handler']
        arguments:
            $clientRepository: '@App\ClientManagement\Infrastructure\Repository\ClientRepository'
            $outboxMessageRepository: '@App\Common\Infrastructure\Repository\OutboxMessageRepository'

    App\ClientManagement\Infrastructure\Repository\ClientRepository:
        arguments:
            $registry: '@doctrine_mongodb'
            $class: 'App\ClientManagement\Domain\Model\Client'

    App\Common\Infrastructure\Repository\OutboxMessageRepository:
        arguments:
            $registry: '@doctrine_mongodb'

    App\Common\Infrastructure\Messaging\EventPublisher:
        arguments:
            - '@enqueue.client.default.traceable_producer'

    App\Common\Infrastructure\Commands\DispatchMessages:
        tags: ['console.command']
        arguments:
            $outboxMessageRepository: '@App\Common\Infrastructure\Repository\OutboxMessageRepository'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
